name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 and 26 are load-bearing: they embed undici 7/8, whose dispatch
        # handler protocol rejected our packaged v6 dispatcher in 0.4.1
        # (UND_ERR_INVALID_ARG on every call, from Node 26). The real-socket
        # tests only exercise that coupling on a host that actually embeds a
        # newer undici.
        node: ['18', '20', '22', '24', '26']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      # The suite was previously never executed in CI — only `build` ran, so a
      # regression could go green all the way to publish.
      # `startup.test.mjs` spawns real servers to exercise proxy handling, so any
      # proxy the runner sets would make those cases test something other than
      # what they claim. Cleared on the command rather than through `env:`,
      # which rejects names differing only in case as duplicates.
      - name: Unit and startup tests
        run: env -u HTTPS_PROXY -u https_proxy -u HTTP_PROXY -u http_proxy npm test

      - name: Sanity-check produced bin
        run: |
          test -x dist/index.js
          # The first line must be a shebang so it can be installed as a global bin.
          head -1 dist/index.js | grep -q '^#!'

      - name: Smoke-test (initialize + tools/list)
        run: |
          cat > /tmp/mcp-test.txt <<'EOF'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}
          EOF
          node dist/index.js < /tmp/mcp-test.txt | tee /tmp/mcp-out.txt
          grep -q '"name":"extract"' /tmp/mcp-out.txt